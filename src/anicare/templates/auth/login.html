{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
  <section class="cartao estreito">
    <h1>Entrar</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ destino or '' }}">
      <label>Username ou email
        <input type="text" name="valor" required autofocus autocomplete="username">
      </label>
      <label>Palavra-passe
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit">Entrar</button>
    </form>
    <p>Ainda não tens conta? <a href="{{ url_for('auth.registo') }}">Regista-te</a>.</p>
  </section>
{% endblock %}
