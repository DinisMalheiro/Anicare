{% extends "base.html" %}
{% block titulo %}Mapa{% endblock %}

{% block cabecalho %}
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
{% endblock %}

{% block conteudo %}
  <form id="filtros" class="filtros">
    <label>Espécie
      <select name="especie_id">
        <option value="">Todas</option>
        {% for e in especies %}<option value="{{ e.id }}">{{ e.nome }}</option>{% endfor %}
      </select>
    </label>
    <label>Estado
      <select name="estado">
        <option value="">Todos</option>
        {% for valor, nome in estados %}<option value="{{ valor }}">{{ nome }}</option>{% endfor %}
      </select>
    </label>
    <span id="contagem" class="contagem"></span>
  </form>

  <div id="mapa" class="mapa" role="application" aria-label="Mapa de animais"></div>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
  <script src="{{ url_for('static', filename='js/mapa.js') }}"></script>
{% endblock %}
